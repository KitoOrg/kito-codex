[package]
name = "kito-codex"
description = "Codex set up to work through Kito: a plugin that writes its rules, tools and hooks"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kito-codex"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
debug = false
strip = true
